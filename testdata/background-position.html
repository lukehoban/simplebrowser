<!doctype html>
<html><head><style>
body { background: #f0f4f8; color: #1b3145; font-family: sans-serif; }
.panel { background-color: #d9e4ee; background-image: linear-gradient(to right, #e95247, #223da7); background-size: 30px 30px; background-repeat: no-repeat; width: 160px; height: 80px; }
</style></head><body>
<h2>Background-position: 30px tile in a 160px box</h2>
<p>Single right: horizontal end, vertical center</p>
<div class="panel" style="background-position:right"></div>
<p>Swapped top right: horizontal end, vertical start</p>
<div class="panel" style="background-position:top right"></div>
<p>Single bottom: horizontal center, vertical end</p>
<div class="panel" style="background-position:bottom"></div>
<p>25% 75%: offset within available space</p>
<div class="panel" style="background-position:25% 75%"></div>
</body></html>
