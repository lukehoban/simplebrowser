<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS named colors</title>
  <style>
    html, body { margin: 0; background: white }
    .swatch { width: 800px; height: 75px }
  </style>
</head>
<body>
  <div class="swatch" style="background:aliceblue"></div>
  <div class="swatch" style="background:AQUA"></div>
  <div class="swatch" style="background:fuchsia"></div>
  <div class="swatch" style="background:olive"></div>
  <div class="swatch" style="background:rebeccapurple"></div>
  <div class="swatch" style="background:darkorange"></div>
  <div class="swatch" style="background:lightseagreen"></div>
  <div class="swatch" style="background:yellowgreen"></div>
</body>
</html>
