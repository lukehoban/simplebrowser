<!doctype html>
<html><head><style>
body { margin: 24px; background: #f5f5f5; font: 18px sans-serif }
.row { margin: 12px 0; background: white; padding: 8px }
.row > * { display: block; width: 400px; height: 56px; background: #dd5555; margin-bottom: 8px; color: white; text-align: center }
.row > i + b { background: #13834a }
.row > i ~ em { background: #315cbe }
.row > b + b { background: #13834a }
</style></head><body>
<h2>CSS element siblings: + and ~</h2>
<div class="row"><i>anchor</i>
<!-- comments and whitespace do not count -->
<b>adjacent +</b><b>adjacent +</b><em>subsequent ~</em></div>
<p>Green: adjacent element. Blue: later sibling. Red: unmatched.</p>
</body></html>
