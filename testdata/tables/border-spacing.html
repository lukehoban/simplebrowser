<!doctype html>
<html><body style="margin:8px;background:#fff">
<!-- Two-value border-spacing: 1em (10px) between columns, 2ex between rows.
     A nested CSS table inherits 3px 12px. Green = table background gaps. -->
<table style="font-size:10px;border-spacing:1em 2ex;background:green">
<tr><td style="width:30px;height:20px;padding:0;background:red"></td><td style="width:30px;height:20px;padding:0;background:red"></td><td style="width:30px;height:20px;padding:0;background:red"></td></tr>
<tr><td style="width:30px;height:20px;padding:0;background:red"></td><td style="width:30px;height:20px;padding:0;background:red"></td><td style="width:30px;height:20px;padding:0;background:red"></td></tr>
</table>
<table style="border-spacing:3px 12px;background:navy;margin-top:8px"><tr><td style="padding:0;background:yellow">
<div style="display:table;background:teal"><div style="display:table-row"><div style="display:table-cell;width:20px;height:10px;background:orange"></div><div style="display:table-cell;width:20px;height:10px;background:orange"></div></div><div style="display:table-row"><div style="display:table-cell;width:20px;height:10px;background:orange"></div><div style="display:table-cell;width:20px;height:10px;background:orange"></div></div></div>
</td></tr></table>
</body></html>
