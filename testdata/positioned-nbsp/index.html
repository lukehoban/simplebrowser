<!doctype html>
<html><head><meta charset="utf-8"><title>Positioned NBSP intrinsic width</title></head>
<body style="margin:0;font:20px monospace">
<div style="position:relative;width:50px;height:90px;background:#eee">
  <div style="position:absolute;left:0;top:0;background:#f99">a&nbsp;b c</div>
</div>
<p style="font:14px sans-serif">Absolute auto width in a 50px containing block.
The NBSP between a and b must not split their min-content run.</p>
</body></html>
