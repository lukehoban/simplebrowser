<!DOCTYPE html>
<!-- Moon infobox shape: a right float beside the lead paragraph. The gray
     box must sit at the right edge with the text wrapping to its left. -->
<style>
  body { width: 600px; font: 16px sans-serif; }
  .infobox { float: right; width: 200px; height: 150px; margin-left: 1em; background: #ccc; }
</style>
<body>
<div class="infobox">float: right</div>
<p>The Moon is the only natural satellite of Earth. It orbits Earth at an average distance of 384,399 kilometers. This text should wrap to the left of the floated gray box instead of starting below it.</p>
</body>
