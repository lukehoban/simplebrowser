<!doctype html>

  <style>
    * { box-sizing: border-box }
    body { margin: 16px; font: 14px Arial, sans-serif; color: #1f2328 }
    table { width: 504px; border-collapse: collapse; table-layout: fixed }
    td { border: 1px solid #d1d9e0; padding: 8px 12px }
    .react-directory-filename-column {
      height: 40px;
      padding-right: 16px;
      align-items: center;
      gap: 4px 10px;
      display: flex;
    }
    .icon { width: 16px; height: 16px; flex: none }
    .overflow-hidden { overflow: hidden }
    .react-directory-filename-cell { font-size: 14px; font-weight: 400; margin: 0 }
    .react-directory-truncate {
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: top;
      max-width: 100%;
      display: inline-block;
      overflow: hidden;
    }
  </style>
</head>
