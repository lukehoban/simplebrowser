<!doctype html>
<html><body style="margin:0;background:#f4f4f4;font:16px sans-serif">
<div style="margin:16px 20px">wrap-reverse: logical end versus flex-end</div>

<div style="margin:12px 20px 4px">Row, negative space: end (left), flex-end (right)</div>
<div style="display:flex;gap:32px;margin:0 20px 18px">
  <div><div style="margin-top:32px;background:white;border:1px solid #888;width:80px;height:50px;display:flex;flex-wrap:wrap-reverse;align-content:end">
    <div style="flex:none;width:80px;height:40px;background:#e75b49"></div><div style="flex:none;width:80px;height:40px;background:#477de0"></div>
  </div></div>
  <div><div style="margin-top:32px;background:white;border:1px solid #888;width:80px;height:50px;display:flex;flex-wrap:wrap-reverse;align-content:flex-end">
    <div style="flex:none;width:80px;height:40px;background:#e75b49"></div><div style="flex:none;width:80px;height:40px;background:#477de0"></div>
  </div></div>
</div>

<div style="margin:12px 20px 4px">Row, positive free space</div>
<div style="display:flex;gap:32px;margin:0 20px 18px">
  <div><div>end</div><div style="background:white;border:1px solid #888;width:80px;height:110px;display:flex;flex-wrap:wrap-reverse;align-content:end">
    <div style="flex:none;width:80px;height:40px;background:#e75b49"></div><div style="flex:none;width:80px;height:40px;background:#477de0"></div>
  </div></div>
  <div><div>flex-end</div><div style="background:white;border:1px solid #888;width:80px;height:110px;display:flex;flex-wrap:wrap-reverse;align-content:flex-end">
    <div style="flex:none;width:80px;height:40px;background:#e75b49"></div><div style="flex:none;width:80px;height:40px;background:#477de0"></div>
  </div></div>
</div>

<div style="margin:12px 20px 4px">Column, negative free space</div>
<div style="display:flex;gap:32px;margin:0 50px">
  <div><div>end</div><div style="background:white;border:1px solid #888;width:50px;height:80px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:end">
    <div style="flex:none;width:40px;height:80px;background:#e75b49"></div><div style="flex:none;width:40px;height:80px;background:#477de0"></div>
  </div></div>
  <div><div>flex-end</div><div style="background:white;border:1px solid #888;width:50px;height:80px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-end">
    <div style="flex:none;width:40px;height:80px;background:#e75b49"></div><div style="flex:none;width:40px;height:80px;background:#477de0"></div>
  </div></div>
</div>
</body></html>
