<!doctype html>
<meta charset="utf-8">
<title>Border width keywords in shorthands</title>
<body style="margin:16px;font:16px sans-serif;color:#172033">
<h1 style="margin:0 0 12px;font-size:20px">Keyword shorthand / numeric equivalent</h1>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:#1769aa solid thin">thin</div>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:#1769aa solid 1px">1px</div>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:medium solid #1769aa">medium</div>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:3px solid #1769aa">3px</div>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:solid thick #1769aa">thick</div>
<div style="width:112px;height:24px;margin:8px 0;background:#e8f0ff;border:solid 5px #1769aa">5px</div>
