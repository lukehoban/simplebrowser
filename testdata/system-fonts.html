<!doctype html>
<html>
<head>
<title>CSS system font shorthand comparison</title>
<style>
body { font: 16px sans-serif; color: #172b40; background: #f5f8fa; margin: 20px; }
h1 { font: bold 22px sans-serif; margin: 0 0 12px; }
p { margin: 4px 0; }
.row { background: white; border: 1px solid #ced8e1; padding: 8px; margin: 6px 0; }
.label { font: 13px monospace; color: #586c7c; }
</style>
</head>
<body>
<h1>System fonts</h1>
<div class="row"><p class="label">caption</p><p style="font: caption">The quick brown fox jumps over 123.</p></div>
<div class="row"><p class="label">icon</p><p style="font: icon">The quick brown fox jumps over 123.</p></div>
<div class="row"><p class="label">menu</p><p style="font: menu">The quick brown fox jumps over 123.</p></div>
<div class="row"><p class="label">message-box</p><p style="font: message-box">The quick brown fox jumps over 123.</p></div>
<div class="row"><p class="label">small-caption</p><p style="font: small-caption">The quick brown fox jumps over 123.</p></div>
<div class="row"><p class="label">status-bar</p><p style="font: status-bar">The quick brown fox jumps over 123.</p></div>
</body>
</html>
