<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  .cell { position: absolute; width: 100px; height: 30px }
  .upper-left { left: 10px; top: 10px; background: #e8eef7 }
  .upper-right { left: 110px; top: 10px; background: #e8eef7 }
  .lower { left: 10px; top: 45px; width: 200px; background: white }
  .left-edge { position: absolute; left: 10px; top: 40px; width: 100px; height: 5px; background: red }
  .right-edge { position: absolute; left: 110px; top: 40px; width: 100px; height: 3px; background: green }
</style>
<div class="cell upper-left"></div>
<div class="cell upper-right"></div>
<div class="left-edge"></div>
<div class="right-edge"></div>
<div class="cell lower"></div>
