<!doctype html>
<meta charset="utf-8">
<link rel="match" href="collapsed-row-span-segments-ref.html">
<style>
  body { margin: 0 }
  table { border-collapse: collapse; margin: 10px }
  td { width: 100px; height: 30px; padding: 0; font-size: 0 }
  .left { background: #e8eef7; border-bottom: 5px solid red }
  .right { background: #e8eef7; border-bottom: 1px solid blue }
  .span { background: white; border-top: 3px solid green }
</style>
<table>
  <tr><td class="left"></td><td class="right"></td></tr>
  <tr><td class="span" colspan="2"></td></tr>
</table>
