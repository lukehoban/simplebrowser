<!doctype html>
<style>
  html, body { margin: 0; width: 400px; height: 400px; }
  body { background: white; font: 16px sans-serif; color: #222; }
  h1 { margin: 18px 20px 12px; font-size: 18px; }
  .row { margin: 0 20px 18px; height: 112px; background: #eee; }
  .atomic { display: inline-block; width: 160px; background: #d7e6ff; vertical-align: top; }
  .definite { height: 64px; background: #e53935; }
  .fixed { height: 96px; }
  .percent { height: 50%; background: #1565c0; }
</style>
<h1>Text-free block descendants</h1>
<div class="row"><div class="atomic"><div class="definite"></div></div></div>
<div class="row"><div class="atomic fixed"><div class="percent"></div></div></div>
