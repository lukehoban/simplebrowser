<!doctype html>
<!-- Authored reduced repro for #352: a transparent generated overlay (as in the
     live GitHub logged-out header) must not hide the page, and fractional
     opacity must fade elements as a group. No network requests. -->
<html><head><style>
body{margin:0;font:16px sans-serif;background:#f6f8fa;color:#1f2328}
header{position:relative;z-index:32;padding:16px;background:#0d1117;color:#fff}
@media (width<=1011.98px){
  header::before{content:"";pointer-events:none;opacity:0;position:absolute;
    top:0;left:0;width:100%;height:600px;background-color:#0d1117}
}
main{padding:16px}
h1{margin:0 0 16px;font-size:24px}
.row{display:flex;gap:16px;margin-bottom:16px}
.swatch{width:160px;height:80px;position:relative}
.swatch div{position:absolute;top:0;width:110px;height:80px;background:#cf222e}
.swatch div + div{left:50px}
.group{opacity:.5}
.each div{opacity:.5}
.faded{width:160px;height:80px;background:#0969da;opacity:40%;color:#fff;padding:4px;box-sizing:border-box}
</style></head><body>
<header>Sign in &nbsp; Appearance settings</header>
<main>
<h1>microsoft / vscode</h1>
<p>Content below a transparent header overlay must stay visible.</p>
<div class="row">
  <div class="swatch group"><div></div><div></div></div>
  <div class="swatch each"><div></div><div></div></div>
  <div class="faded">opacity:40%</div>
</div>
<p>Left: group opacity .5 (no seam). Middle: each child .5 (darker overlap).</p>
</main>
</body></html>
