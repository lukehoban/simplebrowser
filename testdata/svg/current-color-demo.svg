<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" color="#0f766e">
  <style>
    .accent { color: #ea580c; }
    .tile { fill: currentColor; }
  </style>
  <defs>
    <linearGradient id="spectrum">
      <stop color="#7c3aed" stop-color="currentColor"/>
      <stop color="#2563eb" offset="1" stop-color="currentColor"/>
    </linearGradient>
  </defs>
  <rect width="320" height="120" rx="12" fill="#f8fafc"/>
  <rect class="tile" x="20" y="20" width="70" height="80" rx="10"/>
  <g class="accent">
    <circle cx="145" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="12"/>
  </g>
  <rect x="200" y="20" width="100" height="80" rx="10" fill="url(#spectrum)"/>
</svg>
