<svg xmlns="http://www.w3.org/2000/svg" width="180" height="80" viewBox="0 0 180 80">
  <rect width="180" height="80" fill="#f5f1e8"/>
  <defs>
    <!-- #233: a 100-unit viewBox fitted into 20x20 user-space tiles -->
    <pattern id="fitted" width="20" height="20" patternUnits="userSpaceOnUse" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="#16a34a"/>
    </pattern>
    <!-- #231: objectBoundingBox tiles (4x3 per shape) with objectBoundingBox content -->
    <pattern id="bbox" width=".25" height=".3333" patternContentUnits="objectBoundingBox">
      <circle cx=".125" cy=".1667" r=".1" fill="#2563eb"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="75" height="60" fill="url(#fitted) #64748b"/>
  <rect x="95" y="10" width="75" height="60" fill="url(#bbox) #64748b"/>
</svg>
