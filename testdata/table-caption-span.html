<html>

    <caption style="caption-side:bottom;background:#ffe680;text-align:center;padding:8px">Bottom caption spans the table</caption>

    <caption style="background:#ffe680;text-align:center;padding:8px">Top caption spans the table</caption>
  </table>
  <p style="margin:12px">Content after the bottom caption</p>
</body>
</html>
