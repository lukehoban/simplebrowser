<!doctype html>
<html><head><title>Linear-gradient paint preview</title>
<style>
body { margin: 18px; font-family: sans-serif; color: #142334; background: #ecf2f8; }
h1 { font-size: 24px; }
.swatch { width: 600px; height: 78px; margin: 12px 0; border: 3px solid #142334; }
.sunset { background: linear-gradient(to right, #f86a43, #e9c45b 45%, #607fdd); }
.sky { background: linear-gradient(135deg, #254c8a, #6bc8e0 60%, white); }
.overlay { background: linear-gradient(to right, transparent, rgba(230,75,56,0.9)), linear-gradient(#80b2a4, #123b64); }
</style></head><body>
<h1>Linear-gradient background layers</h1>
<div class="swatch sunset"></div><div class="swatch sky"></div><div class="swatch overlay"></div>
<p>Color stops · directions · transparent stacked layers</p>
</body></html>
