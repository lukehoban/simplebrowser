<!doctype html>
<html><head><meta charset="utf-8"><title>Small caps Unicode full case mapping</title>
<style>
body { margin: 20px; font: 20px sans-serif; color: #172e49; }
p { margin: 10px 0; }
.sc { font-variant: small-caps; font-size: 30px; }
</style></head>
<body>
<p>Normal text is unchanged: straße ﬁle ﬂow</p>
<p class="sc">straße Maße</p>
<p class="sc">ﬁle ﬂow Größe</p>
<p class="sc">Ωμέγα café</p>
</body></html>
