<svg xmlns="http://www.w3.org/2000/svg" width="660" height="172" viewBox="0 0 660 172">
  <rect width="660" height="172" fill="#fff"/>
  <text x="16" y="26" font-family="sans-serif" font-size="16" fill="#17243b">Min-content of a·b (· = non-breaking space)</text>
  <text x="16" y="65" font-family="sans-serif" font-size="14" fill="#17243b">Before: split at NBSP</text>
  <rect x="237" y="44" width="70" height="27" fill="#e66b67"/>
  <text x="313" y="63" font-family="sans-serif" font-size="14">a or b (incorrect)</text>
  <text x="16" y="113" font-family="sans-serif" font-size="14" fill="#17243b">After: one unbreakable run</text>
  <rect x="237" y="91" width="210" height="27" fill="#459c76"/>
  <text x="453" y="110" font-family="sans-serif" font-size="14">a·b (correct)</text>
  <text x="16" y="151" font-family="sans-serif" font-size="12" fill="#555">Diagram is schematic; actual glyph widths depend on the font.</text>
</svg>
