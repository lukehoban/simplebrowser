name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Verify committed compatibility report
        run: make compatibility-check
      - name: Upload WPT mismatch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-diagnostics-${{ github.run_id }}
          path: artifacts/wpt/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build
        run: go build ./cmd/simplebrowser

  render:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build renderer
        run: go build -o simplebrowser ./cmd/simplebrowser
      - name: Render Hacker News fixture
        run: |
          mkdir -p render-artifacts
          ./simplebrowser -o render-artifacts/hn-fixture.png testdata/hn/news.html
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: hn-render-${{ github.run_id }}
          path: render-artifacts/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Verify committed screenshot
        run: go run ./cmd/screenshotcheck docs/screenshots/hn-fixture.png render-artifacts/hn-fixture.png
