name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/simplebrowser

  render:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build renderer
        run: go build -o simplebrowser ./cmd/simplebrowser
      - name: Render Hacker News fixture
        run: |
          mkdir -p render-artifacts
          ./simplebrowser -o render-artifacts/hn-fixture.png testdata/hn/news.html
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: hn-render-${{ github.run_id }}
          path: render-artifacts/*.png
          if-no-files-found: error
          retention-days: 14
      # Embedded font rasterization differs by a few pixels across macOS and
      # Linux; keep this diagnostic non-blocking until we normalize it.
      - name: Compare committed screenshot (cross-OS warning)
        run: |
          cmp docs/screenshots/hn-fixture.png render-artifacts/hn-fixture.png || {
            echo "::warning::Screenshot differs from the checked-in macOS render; if painting changed, run 'make screenshot' and commit docs/screenshots/hn-fixture.png"
          }
